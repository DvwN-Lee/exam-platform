# =============================================================================
# ClusterSecretStore - Google Secret Manager
# =============================================================================
# GCP Secret Manager와 연동하여 Kubernetes Secret을 자동 생성.
# Workload Identity를 통해 인증.
#
# Sync Wave: 0 (ESO Application -1 이후에 생성)
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: cluster-secret-store
    app.kubernetes.io/component: external-secrets
spec:
  provider:
    gcpsm:
      # GCP Project ID
      projectID: titanium-k3s-1765951764
      auth:
        workloadIdentity:
          # GKE Cluster 정보
          clusterLocation: asia-northeast3
          clusterName: staging-exam-cluster
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
