apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/component: add-on
    app.kubernetes.io/name: external-secrets
  name: external-secrets
  namespace: argocd
spec:
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  project: default
  revisionHistoryLimit: 5
  source:
    chart: external-secrets
    helm:
      releaseName: external-secrets
      values: |
        # Service Account Workload Identity 설정
        serviceAccount:
          create: true
          name: external-secrets
          annotations:
            iam.gke.io/gcp-service-account: external-secrets-staging@titanium-k3s-1765951764.iam.gserviceaccount.com

        # Controller 설정
        installCRDs: true

        # Webhook 설정
        webhook:
          create: true

        # Cert Controller 설정
        certController:
          create: true
    repoURL: https://charts.external-secrets.io
    targetRevision: 0.9.11
  syncPolicy:
    automated:
      allowEmpty: false
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
      limit: 5
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  labels:
    app.kubernetes.io/component: external-secrets
    app.kubernetes.io/name: cluster-secret-store
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      auth:
        workloadIdentity:
          clusterLocation: asia-northeast3
          clusterName: exam-cluster-staging
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
      projectID: titanium-k3s-1765951764
