# =============================================================================
# ClusterSecretStore - Google Secret Manager
# =============================================================================
# GCP Secret Manager와 연동하여 Kubernetes Secret을 자동 생성.
# Workload Identity를 통해 인증.
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  labels:
    app.kubernetes.io/name: cluster-secret-store
    app.kubernetes.io/component: external-secrets
spec:
  provider:
    gcpsm:
      # GCP Project ID (환경별로 수정 필요)
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          # GKE Cluster 정보 (환경별로 수정 필요)
          clusterLocation: asia-northeast3
          clusterName: exam-cluster-staging
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
