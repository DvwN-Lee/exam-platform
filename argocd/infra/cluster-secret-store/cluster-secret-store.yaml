# =============================================================================
# ClusterSecretStore - Google Secret Manager
# =============================================================================
# GCP Secret Manager와 연동하여 Kubernetes Secret을 자동 생성.
# Workload Identity를 통해 인증.
#
# 이 파일은 cluster-secret-store Application에 의해 관리됨.
# ESO Operator가 CRD를 등록한 이후 적용되므로 별도 Sync Wave 불필요.
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
  labels:
    app.kubernetes.io/name: cluster-secret-store
    app.kubernetes.io/component: external-secrets
spec:
  provider:
    gcpsm:
      # GCP Project ID
      projectID: titanium-k3s-20260123
      auth:
        workloadIdentity:
          # GKE Cluster 정보
          clusterLocation: asia-northeast3-a
          clusterName: prod-exam-cluster
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
