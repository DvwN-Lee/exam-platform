# =============================================================================
# Kustomize Overlay - Production Environment
# =============================================================================
# Production은 자동 Sync 비활성화 (수동 배포 필요)
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Application
      name: exam-platform
    patch: |-
      - op: replace
        path: /metadata/name
        value: exam-prod
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1instance
        value: prod
      - op: replace
        path: /metadata/labels/environment
        value: prod
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"
      - op: replace
        path: /metadata/annotations/notifications.argoproj.io~1subscribe.on-deployed.slack
        value: exam-prod-deployments
      - op: replace
        path: /metadata/annotations/notifications.argoproj.io~1subscribe.on-sync-failed.slack
        value: exam-prod-alerts
      - op: add
        path: /metadata/annotations/notifications.argoproj.io~1subscribe.on-sync-running.slack
        value: exam-prod-deployments
      - op: add
        path: /metadata/annotations/notifications.argoproj.io~1subscribe.on-sync-succeeded.slack
        value: exam-prod-deployments
      - op: add
        path: /metadata/annotations/notifications.argoproj.io~1subscribe.on-health-degraded.slack
        value: exam-prod-alerts
      - op: replace
        path: /spec/destination/namespace
        value: exam-platform-prod
      - op: replace
        path: /spec/source/targetRevision
        value: release
      - op: replace
        path: /spec/source/helm/valueFiles
        value:
          - values-prod.yaml
      - op: add
        path: /spec/source/helm/parameters
        value:
          - name: backend.image.repository
            value: asia-northeast3-docker.pkg.dev/titanium-k3s-20260123/prod-exam-platform/backend
          - name: frontend.image.repository
            value: asia-northeast3-docker.pkg.dev/titanium-k3s-20260123/prod-exam-platform/frontend
      - op: remove
        path: /spec/syncPolicy/automated
      - op: replace
        path: /spec/syncPolicy/syncOptions
        value:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - ApplyOutOfSyncOnly=true
          - RespectIgnoreDifferences=true
      - op: replace
        path: /spec/syncPolicy/retry/limit
        value: 3
      - op: replace
        path: /spec/syncPolicy/retry/backoff/duration
        value: "10s"
      - op: replace
        path: /spec/syncPolicy/retry/backoff/maxDuration
        value: "5m"
      - op: add
        path: /spec/ignoreDifferences
        value:
          - group: apps
            kind: Deployment
            jsonPointers:
              - /spec/replicas
          - group: autoscaling
            kind: HorizontalPodAutoscaler
            jsonPointers:
              - /spec/minReplicas
              - /spec/maxReplicas
      - op: replace
        path: /spec/revisionHistoryLimit
        value: 20
