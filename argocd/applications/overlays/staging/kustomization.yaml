# =============================================================================
# Kustomize Overlay - Staging Environment
# =============================================================================
# GitOps: Pre-production 환경, Auto Sync 활성화
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Application
      name: exam-platform
    patch: |-
      - op: replace
        path: /metadata/name
        value: exam-staging
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1instance
        value: staging
      - op: replace
        path: /metadata/labels/environment
        value: staging
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"
      - op: replace
        path: /spec/destination/namespace
        value: exam-platform-staging
      - op: replace
        path: /spec/source/targetRevision
        value: develop
      - op: replace
        path: /spec/source/helm/valueFiles
        value:
          - values-staging.yaml
      - op: add
        path: /spec/source/helm/parameters
        value:
          - name: backend.image.repository
            value: asia-northeast3-docker.pkg.dev/titanium-k3s-20260123/staging-exam-platform/backend
          - name: frontend.image.repository
            value: asia-northeast3-docker.pkg.dev/titanium-k3s-20260123/staging-exam-platform/frontend
      - op: replace
        path: /spec/syncPolicy/automated
        value:
          prune: true
          selfHeal: true
          allowEmpty: false
      - op: replace
        path: /spec/syncPolicy/syncOptions
        value:
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - ApplyOutOfSyncOnly=true
      - op: replace
        path: /spec/revisionHistoryLimit
        value: 10
