# =============================================================================
# Exam Platform Helm Chart - Production Environment Values
# =============================================================================
# Usage: helm install exam-platform ./charts/exam-platform -f values-prod.yaml
# =============================================================================

namespace:
  name: exam-platform-prod
# -----------------------------------------------------------------------------
# Backend
# -----------------------------------------------------------------------------
backend:
  replicaCount: 2
  image:
    tag: "fa6063a"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  gunicorn:
    workers: 4
    threads: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  livenessProbe:
    enabled: true
    httpGet:
      path: /api/v1/health/live/
      port: 8000
      httpHeaders:
        - name: Host
          value: "exam-platform.me"
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 3
  readinessProbe:
    enabled: true
    httpGet:
      path: /api/v1/health/ready/
      port: 8000
      httpHeaders:
        - name: Host
          value: "exam-platform.me"
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 20
    failureThreshold: 3
  startupProbe:
    enabled: true
    httpGet:
      path: /api/v1/health/live/
      port: 8000
      httpHeaders:
        - name: Host
          value: "exam-platform.me"
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
# -----------------------------------------------------------------------------
# Frontend
# -----------------------------------------------------------------------------
frontend:
  replicaCount: 2
  image:
    tag: "fa6063a"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: exam-platform.me
      paths:
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /admin
          pathType: Prefix
          backend: backend
        - path: /
          pathType: Prefix
          backend: frontend
  tls:
    - secretName: exam-platform-tls
      hosts:
        - exam-platform.me
# -----------------------------------------------------------------------------
# Config
# -----------------------------------------------------------------------------
config:
  allowedHosts: "exam-platform.me,localhost"
  debug: "False"
  # Database endpoints are provided via ExternalSecrets
  postgresHost: ""
  mongodbHost: ""
  redisHost: ""
  # Redis TLS: GCP Memorystore transitEncryptionMode=SERVER_AUTHENTICATION
  redisSSL: "True"
  redisSSLCertReqs: "none"
  # SSL termination at Ingress level, no redirect needed in Django
  secureSSLRedirect: "False"
  sessionCookieSecure: "True"
  csrfCookieSecure: "True"
# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
secrets:
  # External Secrets Operator manages secrets from Google Secret Manager
  create: false
  secretKey: ""
  postgresPassword: ""
  mongodbPassword: ""
  redisPassword: ""
# -----------------------------------------------------------------------------
# External Secrets
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef: "gcp-secret-manager"
  secrets:
    # Database
    dbHost: "examonline-prod-db-host"
    dbPort: "examonline-prod-db-port"
    dbName: "examonline-prod-db-name"
    dbUser: "examonline-prod-db-user"
    dbPassword: "examonline-prod-db-password"
    # Redis
    redisHost: "examonline-prod-redis-host"
    redisPort: "examonline-prod-redis-port"
    redisPassword: "examonline-prod-redis-password"
    # Application
    djangoSecretKey: "examonline-prod-django-secret-key"
    jwtSecretKey: "examonline-prod-jwt-secret-key"
    # GCS
    gcsBucketName: "examonline-prod-gcs-bucket-name"
# -----------------------------------------------------------------------------
# Pod Affinity (High Availability)
# -----------------------------------------------------------------------------
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - exam-platform-backend
          topologyKey: topology.kubernetes.io/zone
