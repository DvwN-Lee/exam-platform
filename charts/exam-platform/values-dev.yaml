# =============================================================================
# Exam Platform Helm Chart - Dev Environment Values
# =============================================================================
# Usage: helm install exam-platform ./charts/exam-platform -f values-dev.yaml
# =============================================================================

namespace:
  create: false
  name: exam-dev

# -----------------------------------------------------------------------------
# Backend
# -----------------------------------------------------------------------------
backend:
  replicaCount: 1

  image:
    tag: "dev-latest"

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  gunicorn:
    workers: 2
    threads: 2

  autoscaling:
    enabled: false

# -----------------------------------------------------------------------------
# Frontend
# -----------------------------------------------------------------------------
frontend:
  replicaCount: 1

  image:
    tag: "dev-latest"

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  hosts:
    - host: dev.exam.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /admin
          pathType: Prefix
          backend: backend
        - path: /
          pathType: Prefix
          backend: frontend

  tls: []

# -----------------------------------------------------------------------------
# Config
# -----------------------------------------------------------------------------
config:
  allowedHosts: "dev.exam.example.com"
  debug: "True"
  secureSSLRedirect: "False"
  sessionCookieSecure: "False"
  csrfCookieSecure: "False"

# -----------------------------------------------------------------------------
# Secrets (disabled - using External Secrets)
# -----------------------------------------------------------------------------
secrets:
  create: false

# -----------------------------------------------------------------------------
# External Secrets (GCP Secret Manager)
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef: "gcp-secret-manager"
  secrets:
    # Database
    dbHost: "examonline-prod-db-host"
    dbPort: "examonline-prod-db-port"
    dbName: "examonline-prod-db-name"
    dbUser: "examonline-prod-db-user"
    dbPassword: "examonline-prod-db-password"
    # Redis
    redisHost: "examonline-prod-redis-host"
    redisPort: "examonline-prod-redis-port"
    redisPassword: "examonline-prod-redis-password"
    # Application
    djangoSecretKey: "examonline-prod-django-secret-key"
    jwtSecretKey: "examonline-prod-jwt-secret-key"
    # GCS
    gcsBucketName: "examonline-prod-gcs-bucket-name"
