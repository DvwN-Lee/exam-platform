{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "exam-platform.secretName" . }}
  namespace: {{ include "exam-platform.namespace" . }}
  labels:
    {{- include "exam-platform.labels" . | nindent 4 }}
type: Opaque
data:
  # Django
  SECRET_KEY: {{ .Values.secrets.secretKey | b64enc | quote }}

  # PostgreSQL
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}

  # MongoDB
  MONGODB_PASSWORD: {{ .Values.secrets.mongodbPassword | b64enc | quote }}

  # Redis
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
{{- end }}
