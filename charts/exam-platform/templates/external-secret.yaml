{{- if .Values.externalSecrets.enabled }}
# =============================================================================
# External Secrets - Database Credentials
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "exam-platform.fullname" . }}-db
  namespace: {{ include "exam-platform.namespace" . }}
  labels:
    {{- include "exam-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef }}
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dbHost }}
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dbPort }}
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dbName }}
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dbUser }}
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.secrets.dbPassword }}

