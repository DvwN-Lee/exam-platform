{{- if .Values.ingress.enabled -}}
{{- if .Values.ingress.authRewrite -}}
{{- if .Values.ingress.authRewrite.enabled -}}
# Separate Ingress for /auth and /users paths with URL rewrite to /api/v1/
# This is needed because the frontend calls /auth/token/ instead of /api/v1/auth/token/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "exam-platform.fullname" . }}-auth-rewrite
  namespace: {{ include "exam-platform.namespace" . }}
  labels:
    {{- include "exam-platform.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$1/$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /(auth|users|subjects|students|questions|testpapers|examinations|dashboard)/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "exam-platform.backend.fullname" $ }}
                port:
                  number: {{ $.Values.backend.service.port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
