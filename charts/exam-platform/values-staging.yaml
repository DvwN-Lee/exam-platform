# =============================================================================
# Exam Platform Helm Chart - Staging Environment Values
# =============================================================================
# Usage: helm install exam-platform ./charts/exam-platform -f values-staging.yaml
# =============================================================================

namespace:
  name: exam-platform-staging

# -----------------------------------------------------------------------------
# Backend
# -----------------------------------------------------------------------------
backend:
  replicaCount: 2

  image:
    tag: "staging"

  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  gunicorn:
    workers: 3
    threads: 2

  autoscaling:
    enabled: false

  livenessProbe:
    enabled: true
    httpGet:
      path: /api/v1/health/live/
      port: 8000
      httpHeaders:
        - name: Host
          value: "staging.exam.example.com"
    initialDelaySeconds: 0  # startupProbe 성공 후 즉시 시작
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /api/v1/health/ready/
      port: 8000
      httpHeaders:
        - name: Host
          value: "staging.exam.example.com"
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

  # Startup Probe: migration, collectstatic 완료 대기
  # /api/v1/health/ready/: DB 연결 확인 포함 (migration 완료 후 정상 응답)
  startupProbe:
    enabled: true
    httpGet:
      path: /api/v1/health/ready/
      port: 8000
      httpHeaders:
        - name: Host
          value: "staging.exam.example.com"
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 20  # MongoDB/Redis health check 대기 시간 고려
    failureThreshold: 30  # 최대 310초 (10 + 10*30) 대기

# -----------------------------------------------------------------------------
# Frontend
# -----------------------------------------------------------------------------
frontend:
  replicaCount: 2

  image:
    tag: "staging"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  hosts:
    - host: staging.exam.example.com
      paths:
        - path: /api
          pathType: Prefix
          backend: backend
        - path: /admin
          pathType: Prefix
          backend: backend
        - path: /
          pathType: Prefix
          backend: frontend

  tls: []

# -----------------------------------------------------------------------------
# Config
# -----------------------------------------------------------------------------
config:
  # localhost: Health Check Pod IP 요청 및 로컬 디버깅용 유지
  allowedHosts: "staging.exam.example.com,localhost"
  debug: "False"

  # Database endpoints are provided via ExternalSecrets
  # See external-secret.yaml template
  postgresHost: ""  # Provided by db-credentials secret
  mongodbHost: ""   # Not used in current implementation
  redisHost: ""     # Provided by redis-credentials secret

  secureSSLRedirect: "False"
  sessionCookieSecure: "False"
  csrfCookieSecure: "False"

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
secrets:
  # External Secrets Operator manages secrets from Google Secret Manager
  create: false
  secretKey: ""
  postgresPassword: ""
  mongodbPassword: ""
  redisPassword: ""

# -----------------------------------------------------------------------------
# External Secrets
# -----------------------------------------------------------------------------
externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef: "gcp-secret-manager"

  secrets:
    # Database
    dbHost: "examonline-staging-db-host"
    dbPort: "examonline-staging-db-port"
    dbName: "examonline-staging-db-name"
    dbUser: "examonline-staging-db-user"
    dbPassword: "examonline-staging-db-password"

    # Redis
    redisHost: "examonline-staging-redis-host"
    redisPort: "examonline-staging-redis-port"
    redisPassword: "examonline-staging-redis-password"

    # Application
    djangoSecretKey: "examonline-staging-django-secret-key"
    jwtSecretKey: "examonline-staging-jwt-secret-key"

    # GCS
    gcsBucketName: "examonline-staging-gcs-bucket-name"
