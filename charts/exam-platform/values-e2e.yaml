# =============================================================================
# Exam Platform Helm Chart - Kind E2E Test Values
# =============================================================================
# Kind Cluster 내 PostgreSQL/Redis Pod와 연동하는 E2E 테스트 전용 설정.
# pullPolicy: Never로 Kind에 load된 로컬 이미지를 사용한다.

# -----------------------------------------------------------------------------
# Backend
# -----------------------------------------------------------------------------
backend:
  replicaCount: 1

  image:
    repository: examonline/backend
    tag: "e2e-test"
    pullPolicy: Never

  # docker-entrypoint.sh가 migration/collectstatic 실행 후 Gunicorn 기동하므로
  # startupProbe로 초기 기동 시간을 확보한다.
  startupProbe:
    enabled: true
    httpGet:
      path: /api/v1/health/
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30

  livenessProbe:
    enabled: false

  readinessProbe:
    enabled: true
    httpGet:
      path: /api/v1/health/
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 10

# -----------------------------------------------------------------------------
# Frontend
# -----------------------------------------------------------------------------
frontend:
  replicaCount: 1

  image:
    repository: examonline/frontend
    tag: "e2e-test"
    pullPolicy: Never

# -----------------------------------------------------------------------------
# Ingress (Kind 환경에서는 port-forward 사용)
# -----------------------------------------------------------------------------
ingress:
  enabled: false

# -----------------------------------------------------------------------------
# ConfigMap
# -----------------------------------------------------------------------------
config:
  djangoSettingsModule: config.production
  allowedHosts: "*"
  debug: "False"

  # PostgreSQL (Kind namespace 내 Pod)
  postgresHost: "postgres.exam-platform.svc.cluster.local"
  postgresPort: "5432"
  postgresDb: "examdb"
  postgresUser: "examuser"

  # MongoDB 비활성화 (빈 문자열이면 Backend deployment에서 env vars 생략)
  mongodbHost: ""

  # Redis (Kind namespace 내 Pod)
  redisHost: "redis.exam-platform.svc.cluster.local"
  redisPort: "6379"

  # SSL 비활성화
  secureSSLRedirect: "False"
  sessionCookieSecure: "False"
  csrfCookieSecure: "False"

# -----------------------------------------------------------------------------
# Secrets
# -----------------------------------------------------------------------------
secrets:
  create: true
  secretKey: "e2e-test-secret-key-not-for-production"
  postgresPassword: "exampass"
  mongodbPassword: ""
  redisPassword: ""

# -----------------------------------------------------------------------------
# Pod Security (Backend=appuser(1000), Frontend=nginx(101) 혼용)
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: false

# -----------------------------------------------------------------------------
# Namespace (kubectl로 미리 생성하므로 Helm에서 생성하지 않음)
# -----------------------------------------------------------------------------
namespace:
  create: false

# -----------------------------------------------------------------------------
# Network Policy
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: false
