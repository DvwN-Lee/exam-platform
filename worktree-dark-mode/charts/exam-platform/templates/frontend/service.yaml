apiVersion: v1
kind: Service
metadata:
  name: {{ include "exam-platform.frontend.fullname" . }}
  namespace: {{ include "exam-platform.namespace" . }}
  labels:
    {{- include "exam-platform.frontend.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "exam-platform.frontend.selectorLabels" . | nindent 4 }}
