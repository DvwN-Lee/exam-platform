name: CD - Staging Full Deployment

on:
  push:
    branches:
      - release/staging
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform Action'
        required: false
        default: 'apply'
        type: choice
        options:
          - apply
          - plan
          - destroy

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-northeast3
  GAR_LOCATION: asia-northeast3
  GAR_REPOSITORY: exam-platform
  K8S_NAMESPACE: default

jobs:
  # -----------------------------------------------------------------------------
  # Job 1: Build and Push Docker Images
  # -----------------------------------------------------------------------------
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tags.outputs.image_tag }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Image Tags
        id: image_tags
        run: |
          VERSION="staging-${{ github.sha }}"
          echo "image_tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./examonline
          file: ./examonline/Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/backend:${{ steps.image_tags.outputs.image_tag }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://staging.examonline.com/api
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/frontend:${{ steps.image_tags.outputs.image_tag }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------------
  # Job 2: Terraform - Infrastructure Only (GKE, CloudSQL, Redis, ArgoCD, ESO)
  # -----------------------------------------------------------------------------
  terraform:
    name: Terraform Infrastructure Deployment
    runs-on: ubuntu-latest
    needs: build
    outputs:
      gke_cluster_name: ${{ steps.terraform_output.outputs.gke_cluster_name }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/environments/gcp-staging
        run: terraform init

      - name: Terraform Workspace
        working-directory: terraform/environments/gcp-staging
        run: |
          terraform workspace select staging || terraform workspace new staging

      - name: Terraform Plan
        working-directory: terraform/environments/gcp-staging
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.terraform_action != 'plan'
        working-directory: terraform/environments/gcp-staging
        run: terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        id: terraform_output
        working-directory: terraform/environments/gcp-staging
        run: |
          echo "gke_cluster_name=$(terraform output -raw gke_cluster_name)" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------------
  # Job 3: Verify Infrastructure and ArgoCD
  # -----------------------------------------------------------------------------
  verify:
    name: Verify Infrastructure
    runs-on: ubuntu-latest
    needs: [terraform]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ needs.terraform.outputs.gke_cluster_name }}
          location: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify ArgoCD Installation
        run: |
          echo "=== ArgoCD Pods ==="
          kubectl get pods -n argocd
          echo ""
          echo "=== External Secrets Operator Pods ==="
          kubectl get pods -n external-secrets
          echo ""
          echo "=== ClusterSecretStore ==="
          kubectl get clustersecretstore
          echo ""
          echo "=== ArgoCD Applications ==="
          kubectl get applications -n argocd

      - name: Application Deployment Status
        run: |
          echo "Application deployment is managed by ArgoCD."
          echo "ArgoCD will automatically sync changes from the Git repository."
          echo "Check ArgoCD UI for deployment status: kubectl port-forward svc/argocd-server -n argocd 8080:443"
