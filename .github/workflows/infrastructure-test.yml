name: Infrastructure Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'terraform/**'
      - 'charts/**'
      - 'argocd/**'
      - 'tests/terratest/**'
      - '.github/workflows/infrastructure-test.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'charts/**'
      - 'argocd/**'
      - 'tests/terratest/**'
  workflow_dispatch:

env:
  GO_VERSION: '1.22'
  TERRAFORM_VERSION: '1.7.0'
  HELM_VERSION: '3.14.0'
  NODE_VERSION: '20'

jobs:
  terraform-tests:
    name: Terraform Module Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/terratest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Download Go Modules
        run: go mod download

      - name: Run GCP VPC Module Tests
        run: go test -v -timeout 30m ./terraform/gcp-vpc/...

      - name: Run GCS Module Tests
        run: go test -v -timeout 30m ./terraform/gcs/...

      - name: Run GAR Module Tests
        run: go test -v -timeout 30m ./terraform/gar/...

      - name: Run Memorystore Module Tests
        run: go test -v -timeout 30m ./terraform/memorystore/...

      - name: Run Cloud SQL Module Tests
        run: go test -v -timeout 30m ./terraform/cloudsql/...

      - name: Run GKE Module Tests
        run: go test -v -timeout 30m ./terraform/gke/...

  kustomize-build-check:
    name: Kustomize Generated Files Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Rebuild Generated Files
        run: |
          for env in dev staging prod; do
            kubectl kustomize argocd/applications/overlays/${env} > argocd/generated/exam-${env}.yaml
          done

      - name: Check for Drift
        run: |
          if ! git diff --exit-code argocd/generated/; then
            echo "::error::Generated files are out of sync with overlay definitions. Run 'kubectl kustomize' and commit the results."
            exit 1
          fi

  helm-lint-tests:
    name: Helm Chart Lint Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Helm Lint - Default Values
        run: helm lint charts/exam-platform

      - name: Helm Lint - Dev Values
        run: helm lint charts/exam-platform -f charts/exam-platform/values-dev.yaml

      - name: Helm Lint - Staging Values
        run: helm lint charts/exam-platform -f charts/exam-platform/values-staging.yaml

      - name: Helm Lint - Prod Values
        run: helm lint charts/exam-platform -f charts/exam-platform/values-prod.yaml

      - name: Helm Lint - E2E Values
        run: helm lint charts/exam-platform -f charts/exam-platform/values-e2e.yaml

  helm-template-tests:
    name: Helm Template Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/terratest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Download Go Modules
        run: go mod download

      - name: Run Helm Template Tests
        run: go test -v -timeout 10m ./helm/... -run 'Template|Lint'

  integration-tests:
    name: Integration Tests (Kind)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [terraform-tests, helm-lint-tests, helm-template-tests]
    defaults:
      run:
        working-directory: tests/terratest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: tests/terratest/go.sum

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: exam-test
          wait: 120s

      - name: Download Go Modules
        run: go mod download

      - name: Run Integration Tests
        env:
          RUN_INTEGRATION_TESTS: 'true'
        run: go test -v -timeout 30m ./helm/... -run 'Integration'

      - name: Get Cluster Info on Failure
        if: failure()
        run: |
          kubectl cluster-info
          kubectl get pods -A
          kubectl get events -A --sort-by='.lastTimestamp'

  playwright-smoke-tests:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: integration-tests
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker 이미지 빌드
      - name: Build Backend Image
        run: docker build -t examonline/backend:e2e-test ../examonline

      - name: Build Frontend Image
        run: docker build -t examonline/frontend:e2e-test ../frontend

      # Node.js + Playwright 설치
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Helm + Kind 설정
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: exam-e2e
          wait: 120s

      # Kind에 이미지 로드
      - name: Load Images into Kind
        run: |
          kind load docker-image examonline/backend:e2e-test --name exam-e2e
          kind load docker-image examonline/frontend:e2e-test --name exam-e2e

      # PostgreSQL + Redis 배포
      - name: Deploy PostgreSQL and Redis
        run: |
          kubectl create namespace exam-platform

          kubectl run postgres \
            --image=postgres:18 \
            --env="POSTGRES_USER=examuser" \
            --env="POSTGRES_PASSWORD=exampass" \
            --env="POSTGRES_DB=examdb" \
            --port=5432 \
            -n exam-platform
          kubectl expose pod postgres --port=5432 -n exam-platform

          kubectl run redis \
            --image=redis:7 \
            --port=6379 \
            -n exam-platform
          kubectl expose pod redis --port=6379 -n exam-platform

          kubectl wait --for=condition=Ready pod/postgres -n exam-platform --timeout=120s
          kubectl wait --for=condition=Ready pod/redis -n exam-platform --timeout=60s

          for i in $(seq 1 12); do
            if kubectl exec postgres -n exam-platform -- pg_isready -U examuser 2>/dev/null; then
              echo "PostgreSQL is ready (attempt $i)"
              break
            fi
            echo "Waiting for PostgreSQL... (attempt $i/12)"
            sleep 5
          done

      # Application 배포
      - name: Deploy Application
        run: |
          helm install exam-test ../charts/exam-platform \
            -f ../charts/exam-platform/values-e2e.yaml \
            -n exam-platform \
            --wait --timeout 5m

      # Backend 기동 확인
      - name: Verify Backend Health
        run: |
          kubectl wait --for=condition=Ready \
            pod -l app.kubernetes.io/component=backend \
            -n exam-platform --timeout=180s

          kubectl port-forward svc/exam-test-exam-platform-backend 8000:8000 -n exam-platform &
          sleep 3
          for i in $(seq 1 6); do
            if curl -s http://localhost:8000/api/v1/health/ | grep -q "ok\|healthy"; then
              echo "Backend health check passed (attempt $i)"
              break
            fi
            echo "Waiting for backend health... (attempt $i/6)"
            sleep 5
          done
          kill %1 2>/dev/null || true

      # Frontend Port Forward + Smoke Tests
      - name: Port Forward Frontend
        run: |
          kubectl port-forward svc/exam-test-exam-platform-frontend 3000:80 -n exam-platform &
          sleep 5

      - name: Run Smoke Tests
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:3000'
        run: npx playwright test --config=playwright.smoke.config.ts

      # 실패 시 디버그 정보 수집
      - name: Debug Info on Failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n exam-platform -o wide
          echo "=== Backend Logs ==="
          kubectl logs -l app.kubernetes.io/component=backend -n exam-platform --tail=50 || true
          echo "=== Frontend Logs ==="
          kubectl logs -l app.kubernetes.io/component=frontend -n exam-platform --tail=50 || true
          echo "=== Events ==="
          kubectl get events -n exam-platform --sort-by='.lastTimestamp' | tail -20

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-report
          path: frontend/playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [terraform-tests, helm-lint-tests, helm-template-tests, kustomize-build-check]
    if: always()

    steps:
      - name: Check Test Results
        run: |
          echo "## Infrastructure Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Module Tests | ${{ needs.terraform-tests.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm Lint Tests | ${{ needs.helm-lint-tests.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Helm Template Tests | ${{ needs.helm-template-tests.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kustomize Build Check | ${{ needs.kustomize-build-check.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
