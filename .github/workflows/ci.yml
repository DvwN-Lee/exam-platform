# =============================================================================
# CI Pipeline (Fast Pipeline)
# =============================================================================
# Backend: lint, type-check, test (변경 시에만)
# Frontend: lint, type-check, build (변경 시에만)
# Docker: build (조건부)
# E2E: e2e.yml로 분리됨

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  # ===========================================================================
  # Change Detection (dorny/paths-filter)
  # ===========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'examonline/**'
            frontend:
              - 'frontend/**'

  # ===========================================================================
  # Backend Lint
  # ===========================================================================
  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./examonline
        run: uv sync --extra dev

      - name: Run ruff check
        working-directory: ./examonline
        run: uv run ruff check .

      - name: Run ruff format check
        working-directory: ./examonline
        run: uv run ruff format --check .

  # ===========================================================================
  # Backend Type Check
  # ===========================================================================
  type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./examonline
        run: uv sync --extra dev

      - name: Run mypy
        working-directory: ./examonline
        # Python 3.14 + django-stubs 호환성 문제로 임시 continue-on-error 설정
        continue-on-error: true
        run: uv run mypy apps --ignore-missing-imports

  # ===========================================================================
  # Backend Tests
  # ===========================================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [changes, lint-backend, type-check]
    if: ${{ needs.changes.outputs.backend == 'true' }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          POSTGRES_DB: examdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./examonline
        run: uv sync --extra dev

      - name: Run tests with coverage
        working-directory: ./examonline
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          DJANGO_SETTINGS_MODULE: config.local
        run: |
          uv run pytest --cov=apps --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./examonline/coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # Frontend Lint & Build
  # ===========================================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build

  # ===========================================================================
  # Docker Build (조건부 실행)
  # ===========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [changes, test-backend, frontend]
    if: |
      always() &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend image
        if: ${{ needs.changes.outputs.backend == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./examonline
          file: ./examonline/Dockerfile
          push: false
          tags: exam-platform/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: exam-platform/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
