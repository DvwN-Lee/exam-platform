# =============================================================================
# CI Pipeline
# =============================================================================
# Backend: lint, type-check, test
# Frontend: lint, type-check, build
# Docker: build (no push)
# E2E: Playwright tests

name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  # ===========================================================================
  # Backend Lint
  # ===========================================================================
  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./examonline
        run: uv sync --extra dev

      - name: Run ruff check
        working-directory: ./examonline
        run: uv run ruff check .

      - name: Run ruff format check
        working-directory: ./examonline
        run: uv run ruff format --check .

  # ===========================================================================
  # Backend Type Check
  # ===========================================================================
  type-check:
    name: Backend Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./examonline
        run: uv sync --extra dev

      - name: Run mypy
        working-directory: ./examonline
        # Python 3.14 + django-stubs 호환성 문제로 임시 continue-on-error 설정
        continue-on-error: true
        run: uv run mypy apps --ignore-missing-imports

  # ===========================================================================
  # Backend Tests
  # ===========================================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [lint-backend, type-check]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          POSTGRES_DB: examdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./examonline
        run: uv sync --extra dev

      - name: Run tests with coverage
        working-directory: ./examonline
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          DJANGO_SETTINGS_MODULE: config.local
        run: |
          uv run pytest --cov=apps --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./examonline/coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # Frontend Lint & Build
  # ===========================================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build

  # ===========================================================================
  # Docker Build (no push)
  # ===========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./examonline
          file: ./examonline/Dockerfile
          push: false
          tags: exam-platform/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: exam-platform/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # E2E Tests
  # ===========================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, frontend]
    # Main 브랜치이거나 'run-e2e' 라벨이 있을 때만 실행
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-e2e')

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          POSTGRES_DB: examdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend dependencies
        working-directory: ./examonline
        run: uv sync --extra dev

      - name: Run migrations
        working-directory: ./examonline
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          DJANGO_SETTINGS_MODULE: config.local
          E2E_MOCK_TIME_ENABLED: "true"
          REDIS_URL: redis://localhost:6379/0
        run: uv run python manage.py migrate

      - name: Create test subjects
        working-directory: ./examonline
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          DJANGO_SETTINGS_MODULE: config.local
          E2E_MOCK_TIME_ENABLED: "true"
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run python manage.py shell -c "
          from user.models import SubjectInfo
          subjects = ['수학', '과학', '영어', '국어', '사회']
          for name in subjects:
              SubjectInfo.objects.get_or_create(subject_name=name)
          print(f'Created {SubjectInfo.objects.count()} subjects')
          "

      - name: Start Backend server
        working-directory: ./examonline
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          DJANGO_SETTINGS_MODULE: config.local
          E2E_TEST_API_ENABLED: "true"
          E2E_MOCK_TIME_ENABLED: "true"
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run python manage.py runserver &
          sleep 10
          curl -s http://localhost:8000/api/v1/health/ || echo "Health check skipped"

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "Running Full E2E Tests..."
            npx playwright test --project=chromium
          else
            echo "Running Smoke Tests only..."
            npx playwright test --project=chromium --grep "@smoke" || echo "No smoke tests found"
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
