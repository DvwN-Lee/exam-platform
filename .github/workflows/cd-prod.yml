# =============================================================================
# CD Pipeline - Production Environment
# =============================================================================
# Trigger: Manual (workflow_dispatch)
# Target: GKE Prod Cluster (ArgoCD managed)
# Registry: Google Artifact Registry (prod-exam-platform)
# Deploy: Build images -> Push to GAR -> Update ArgoCD image tags -> Sync

name: CD - Production

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Backend 배포 포함'
        required: false
        type: boolean
        default: true
      deploy_frontend:
        description: 'Frontend 배포 포함'
        required: false
        type: boolean
        default: true

env:
  GCP_REGION: asia-northeast3
  GAR_LOCATION: asia-northeast3-docker.pkg.dev
  REPOSITORY: prod-exam-platform
  BACKEND_IMAGE: backend
  FRONTEND_IMAGE: frontend
  GKE_ZONE: asia-northeast3-a
  NAMESPACE: exam-platform-prod
  ARGOCD_APP: exam-prod

jobs:
  # ===========================================================================
  # Build & Push Images
  # ===========================================================================
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
      short_sha: ${{ steps.tags.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend image
        if: ${{ inputs.deploy_backend }}
        uses: docker/build-push-action@v6
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
        with:
          context: ./examonline
          file: ./examonline/Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        if: ${{ inputs.deploy_frontend }}
        uses: docker/build-push-action@v6
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.image_tag }}
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GAR_LOCATION }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Deploy via ArgoCD
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_PROD }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Update ArgoCD image tags
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DEPLOY_BACKEND: ${{ inputs.deploy_backend }}
          DEPLOY_FRONTEND: ${{ inputs.deploy_frontend }}
        run: |
          PATCH='{"spec":{"source":{"helm":{"parameters":['
          PARAMS=""

          if [ "$DEPLOY_BACKEND" = "true" ]; then
            PARAMS='{"name":"backend.image.tag","value":"'"${IMAGE_TAG}"'"}'
            echo "Updating backend image tag to: ${IMAGE_TAG}"
          fi

          if [ "$DEPLOY_FRONTEND" = "true" ]; then
            if [ -n "$PARAMS" ]; then
              PARAMS="${PARAMS},"
            fi
            PARAMS="${PARAMS}"'{"name":"frontend.image.tag","value":"'"${IMAGE_TAG}"'"}'
            echo "Updating frontend image tag to: ${IMAGE_TAG}"
          fi

          # repository parameter 유지
          BACKEND_REPO="${GAR_LOCATION}/${PROJECT_ID}/${REPOSITORY}/${BACKEND_IMAGE}"
          FRONTEND_REPO="${GAR_LOCATION}/${PROJECT_ID}/${REPOSITORY}/${FRONTEND_IMAGE}"
          PARAMS="${PARAMS},"'{"name":"backend.image.repository","value":"'"${BACKEND_REPO}"'"}'
          PARAMS="${PARAMS},"'{"name":"frontend.image.repository","value":"'"${FRONTEND_REPO}"'"}'

          PATCH="${PATCH}${PARAMS}]}}}}"

          kubectl -n argocd patch application "$ARGOCD_APP" --type=merge -p "$PATCH"
          echo "ArgoCD application patched"

      - name: Trigger ArgoCD sync
        run: |
          kubectl -n argocd patch application "$ARGOCD_APP" --type=merge \
            -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}'

          echo "Waiting for ArgoCD sync..."
          sleep 15

      - name: Wait for rollout
        run: |
          echo "Waiting for backend rollout..."
          kubectl rollout status deployment/exam-prod-exam-platform-backend \
            -n "$NAMESPACE" --timeout=5m || true

          echo "Waiting for frontend rollout..."
          kubectl rollout status deployment/exam-prod-exam-platform-frontend \
            -n "$NAMESPACE" --timeout=5m || true

      - name: Verify deployment
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          echo "## Production Deployment Info" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource | Image Tag | Ready |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"

          BACKEND_IMG=$(kubectl get deployment exam-prod-exam-platform-backend \
            -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}')
          FRONTEND_IMG=$(kubectl get deployment exam-prod-exam-platform-frontend \
            -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}')

          BACKEND_READY=$(kubectl get deployment exam-prod-exam-platform-backend \
            -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}/{.spec.replicas}')
          FRONTEND_READY=$(kubectl get deployment exam-prod-exam-platform-frontend \
            -n "$NAMESPACE" -o jsonpath='{.status.readyReplicas}/{.spec.replicas}')

          echo "| Backend | ${BACKEND_IMG##*:} | ${BACKEND_READY} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | ${FRONTEND_IMG##*:} | ${FRONTEND_READY} |" >> "$GITHUB_STEP_SUMMARY"

          echo "Backend: $BACKEND_IMG ($BACKEND_READY)"
          echo "Frontend: $FRONTEND_IMG ($FRONTEND_READY)"

      # =========================================================================
      # Notification
      # =========================================================================
      - name: Send Slack notification (Success)
        if: success()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ACTOR: ${{ github.actor }}
        with:
          payload: |
            {
              "text": "Production Deployment Success",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Success*\n\nImage Tag: `${{ env.IMAGE_TAG }}`\nDeployed by: ${{ env.ACTOR }}\nEnvironment: production"
                  }
                }
              ]
            }

      - name: Send Slack notification (Failure)
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v1.27.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          payload: |
            {
              "text": "Production Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed*\n\nImage Tag: `${{ env.IMAGE_TAG }}`\nDeployed by: ${{ env.ACTOR }}\nWorkflow: ${{ env.RUN_URL }}"
                  }
                }
              ]
            }
