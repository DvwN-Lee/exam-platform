# =============================================================================
# E2E Tests (Quality Gate)
# =============================================================================
# PR: Smoke 테스트 (~10개, 핵심 기능만)
# Main Push: CI 테스트 (~100개, edge-cases/layout/validation 제외)
# Manual: 선택적 실행 (smoke/ci/full)

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test Scope'
        required: true
        default: 'ci'
        type: choice
        options:
          - smoke
          - ci
          - full

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          POSTGRES_DB: examdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend dependencies
        working-directory: ./examonline
        run: uv sync --extra dev

      - name: Run migrations
        working-directory: ./examonline
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          DJANGO_SETTINGS_MODULE: config.local
          E2E_MOCK_TIME_ENABLED: "true"
          REDIS_URL: redis://localhost:6379/0
        run: uv run python manage.py migrate

      - name: Create test subjects
        working-directory: ./examonline
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          DJANGO_SETTINGS_MODULE: config.local
          E2E_MOCK_TIME_ENABLED: "true"
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run python manage.py shell -c "
          from user.models import SubjectInfo
          subjects = ['수학', '과학', '영어', '국어', '사회']
          for name in subjects:
              SubjectInfo.objects.get_or_create(subject_name=name)
          print(f'Created {SubjectInfo.objects.count()} subjects')
          "

      - name: Start Backend server
        working-directory: ./examonline
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          DJANGO_SETTINGS_MODULE: config.local
          E2E_TEST_API_ENABLED: "true"
          E2E_MOCK_TIME_ENABLED: "true"
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run python manage.py runserver 0.0.0.0:8000 &
          echo "Backend server starting..."

          # Health check with retry (최대 30초 대기)
          for i in {1..6}; do
            if curl -s http://localhost:8000/api/v1/health/ > /dev/null 2>&1; then
              echo "Backend server is ready (attempt $i)"
              break
            fi
            echo "Waiting for backend... (attempt $i/6)"
            sleep 5
          done

          # Health check 결과 출력
          curl -s http://localhost:8000/api/v1/health/ || echo "Health check failed"

      - name: Install Frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Verify API endpoints
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
          DJANGO_SETTINGS_MODULE: config.local
          E2E_TEST_API_ENABLED: "true"
          REDIS_URL: redis://localhost:6379/0
        run: |
          echo "=== API Endpoint Verification ==="

          # 1. 테스트 교사 계정 생성 및 로그인
          echo "Creating test teacher account..."
          cd examonline
          uv run python manage.py shell -c "
          from user.models import UserProfile
          if not UserProfile.objects.filter(username='testteacher2').exists():
              user = UserProfile.objects.create_user(
                  username='testteacher2',
                  password='test12345678',
                  user_type='teacher',
                  nick_name='TestTeacher'
              )
              print(f'Created teacher: {user.username}')
          else:
              print('Teacher account already exists')
          "
          cd ..

          # 2. 로그인하여 토큰 획득
          echo "Getting auth token..."
          TOKEN_RESPONSE=$(curl -s -X POST http://localhost:8000/api/v1/auth/token/ \
            -H "Content-Type: application/json" \
            -d '{"username":"testteacher2","password":"test12345678"}')
          echo "Token response: $TOKEN_RESPONSE"

          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | python3 -c "import sys, json; print(json.load(sys.stdin).get('access', ''))" 2>/dev/null || echo "")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Warning: Could not get access token"
          else
            echo "Got access token (${#ACCESS_TOKEN} chars)"

            # 3. Examinations API 응답 시간 측정
            echo "Testing /api/v1/examinations/ endpoint..."
            START_TIME=$(date +%s%N)
            EXAM_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET http://localhost:8000/api/v1/examinations/ \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json")
            END_TIME=$(date +%s%N)

            HTTP_CODE=$(echo "$EXAM_RESPONSE" | tail -n1)
            RESPONSE_BODY=$(echo "$EXAM_RESPONSE" | head -n -1)
            ELAPSED_MS=$(( (END_TIME - START_TIME) / 1000000 ))

            echo "HTTP Status: $HTTP_CODE"
            echo "Response time: ${ELAPSED_MS}ms"
            echo "Response (first 200 chars): ${RESPONSE_BODY:0:200}"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Warning: Examinations API returned non-200 status"
            fi
          fi

          echo "=== API Verification Complete ==="

      - name: Determine test scope
        id: test-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          INPUT_SCOPE: ${{ inputs.test_scope }}
        run: |
          # Manual Dispatch
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "scope=$INPUT_SCOPE" >> "$GITHUB_OUTPUT"
            echo "Test scope (Manual): $INPUT_SCOPE"
          # Main Push -> CI (edge-cases, layout, validation 제외)
          elif [ "$GIT_REF" == "refs/heads/main" ]; then
            echo "scope=ci" >> "$GITHUB_OUTPUT"
            echo "Test scope (Main Push): ci"
          # PR -> Smoke
          else
            echo "scope=smoke" >> "$GITHUB_OUTPUT"
            echo "Test scope (PR): smoke"
          fi

      - name: Run E2E tests
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          TEST_SCOPE: ${{ steps.test-scope.outputs.scope }}
        run: |
          if [ "$TEST_SCOPE" == "full" ]; then
            echo "Running Full E2E Tests..."
            npx playwright test --project=chromium
          elif [ "$TEST_SCOPE" == "ci" ]; then
            echo "Running CI E2E Tests (excluding edge-cases, layout, validation)..."
            npx playwright test --project=chromium --config=playwright.ci.config.ts
          else
            echo "Running Smoke Tests..."
            npx playwright test --project=chromium --grep "@smoke"
          fi

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
